<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Knight</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Last Knight">
      <section class="auth-modal" id="auth-modal" aria-label="Last Knight account" aria-hidden="true">
        <div class="auth-card">
          <h2>Enter Last Knight</h2>
          <p class="auth-subtitle">Use a username and password to keep your progress.</p>
          <input id="auth-username" type="text" placeholder="Username" autocomplete="username" maxlength="24" />
          <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" />
          <p class="auth-status" id="auth-status" aria-live="polite"></p>
          <div class="auth-actions">
            <button id="auth-login" type="button">Log In</button>
            <button id="auth-signup" type="button">Sign Up</button>
          </div>
          <button class="auth-guest" id="auth-guest" type="button">Play as Guest</button>
        </div>
      </section>
      <section class="loading-screen" id="loading-screen" aria-live="polite">
        <div class="loading-art" aria-hidden="true"></div>
        <div class="loading-ui">
          <div class="progress-track" role="progressbar" aria-label="Loading Last Knight" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-glint"></div>
          </div>
          <p class="loading-status" id="loading-status">Preparing the arena <span id="progress-value">0%</span></p>
        </div>
      </section>

      <section class="main-screen" id="main-screen" aria-label="Last Knight main screen" aria-hidden="true">
        <div class="main-screen-art">
          <img src="Last Knight Assets/Last Knight Main Screen Asset.gif" alt="Last Knight main screen" />
          <span class="coin-count" id="coin-count" aria-label="Coins">0</span>
          <div class="menu-hit-areas" aria-label="Main menu">
            <button class="menu-hit-area menu-hit-area--shop" data-screen="Shop Screen.png" aria-label="Open Shop"></button>
            <button class="menu-hit-area menu-hit-area--coins" data-screen="Shop Screen.png" aria-label="Open Shop from Coins"></button>
            <button class="menu-hit-area menu-hit-area--quests" data-screen="Quest Screen.png" aria-label="Open Quests"></button>
            <button class="menu-hit-area menu-hit-area--stats" data-screen="Stats Screen.png" aria-label="Open Stats"></button>
            <button class="menu-hit-area menu-hit-area--settings" data-screen="Settings Screen.png" aria-label="Open Settings"></button>
            <button class="menu-hit-area menu-hit-area--skills" data-screen="Skills Screen.png" aria-label="Open Skills"></button>
            <button class="menu-hit-area menu-hit-area--achievements" data-screen="Achievements Screen.png" aria-label="Open Achievements"></button>
            <button class="menu-hit-area menu-hit-area--leaderboard" data-screen="Leaderboard Screen.png" aria-label="Open Leaderboard"></button>
            <button class="menu-hit-area menu-hit-area--playtime" data-screen="Play Time Screen.png" aria-label="Open Play Time Rewards"></button>
            <button class="menu-hit-area menu-hit-area--arena" data-screen="Last Knight Arena Asset.gif" data-screen-path="Last Knight Assets/" data-screen-aspect="1152 / 768" aria-label="Enter Arena"></button>
          </div>
        </div>
      </section>

      <section class="sub-screen" id="sub-screen" aria-hidden="true" aria-label="Menu screen">
        <div class="sub-screen-frame">
          <img id="sub-screen-image" src="" alt="" />
          <div class="playtime-rewards" id="playtime-rewards" aria-label="Play time rewards"></div>
          <div class="shop-offers" id="shop-offers" aria-label="Coin offers"></div>
          <div class="achievement-list" id="achievement-list" aria-label="Achievements"></div>
          <div class="skills-tree" id="skills-tree" aria-label="Skills"></div>
          <div class="stats-overview" id="stats-overview" aria-label="Stats overview"></div>
          <div class="settings-panel" id="settings-panel" aria-label="Settings">
            <div class="settings-volume-row"><input id="music-volume" type="range" min="0" max="100" value="70" aria-label="Music volume"><output id="music-volume-value">70%</output></div>
            <div class="settings-code-row"><input id="redeem-code" type="text" placeholder="Enter redeem code" aria-label="Redeem code"><button id="redeem-code-button" type="button">Redeem</button></div>
            <p id="redeem-code-status" aria-live="polite"></p>
          </div>
          <div class="arena-controls" id="arena-controls" aria-label="Arena controls">
            <div class="arena-enemies" id="arena-enemies" aria-label="Enemies"></div>
            <div class="arena-projectiles" id="arena-projectiles" aria-label="Projectiles"></div>
            <div class="arena-potions" id="arena-potions" aria-label="Potions"></div>
            <div class="arena-player-vitals" id="arena-player-vitals" aria-label="Player health and shield">
              <div class="arena-vital-bar arena-vital-bar--health"><span id="player-health-fill"></span></div>
              <div class="arena-vital-bar arena-vital-bar--shield"><span id="player-shield-fill"></span></div>
            </div>
            <img class="arena-player" id="arena-player" src="" alt="Default knight" />
            <span class="arena-player-attack" id="arena-player-attack" aria-hidden="true"></span>
            <div class="arena-wave-hud" aria-live="polite">
              <strong id="arena-wave-number">Wave 1</strong>
              <span id="arena-enemies-left">Enemies Left: 0</span>
            </div>
            <div class="arena-hotbar" id="arena-hotbar" aria-label="Weapon hotbar"></div>
            <section class="arena-upgrade-phase" id="arena-upgrade-phase" aria-label="Choose an upgrade">
              <div class="arena-upgrade-cards" id="arena-upgrade-cards"></div>
            </section>
            <button class="arena-stats-toggle" id="arena-stats-toggle" type="button" aria-expanded="false">Show Stats</button>
            <aside class="arena-stats" id="arena-stats" aria-label="Player stats" hidden>
              <h2>Stats</h2>
              <button class="arena-stats-close" id="arena-stats-close" type="button" aria-label="Hide stats">Hide</button>
              <div><span>Health</span><strong id="stat-health">100</strong></div>
              <div><span>Shield</span><strong id="stat-shield">25</strong></div>
              <div><span>Damage</span><strong id="stat-damage">x1.00</strong></div>
              <div><span>Speed</span><strong id="stat-speed">x1.00</strong></div>
              <div><span>Crit Chance</span><strong id="stat-crit">30%</strong></div>
            </aside>
            <aside class="arena-collected" aria-label="Coins collected this run">
              <span>You've Collected:</span>
              <strong id="arena-run-coins">0</strong>
            </aside>
            <div class="arena-special-upgrades" aria-label="Special upgrades">
              <button class="arena-special-slot" data-special="bouncyProjectile" type="button" disabled aria-label="Locked special upgrade"></button>
              <button class="arena-special-slot" data-special="lifeSteal" type="button" disabled aria-label="Locked special upgrade"></button>
              <button class="arena-special-slot" data-special="fireTrail" type="button" disabled aria-label="Locked special upgrade"></button>
              <button class="arena-special-slot" data-special="precision" type="button" disabled aria-label="Locked special upgrade"></button>
              <button class="arena-special-slot" data-special="autoHealing" type="button" disabled aria-label="Locked special upgrade"></button>
            </div>
          </div>
          <section class="arena-game-over" id="arena-game-over" aria-hidden="true">
            <h2>Game Over</h2>
            <p>Coins Earned <strong id="game-over-earned">0 Coins</strong></p>
            <p>Current Wave <strong id="game-over-wave">1</strong></p>
            <p>Total Coins <strong id="game-over-total">0 Coins</strong></p>
            <button id="game-over-back" type="button">Return to Main Menu</button>
          </section>
          <button class="sub-screen-back" id="sub-screen-back" type="button">Back to Main Menu</button>
        </div>
      </section>

      <div class="screen-flash" id="screen-flash" aria-hidden="true"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="game.js"></script>
    <script src="loading-screen.js"></script>
  </body>
</html>
